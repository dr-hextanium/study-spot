name: smoke-deploy

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Commit /health must report (empty: any)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      expected_commit:
        description: "Commit /health must report (empty: any)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - name: Smoke the live stack
        run: bun run smoke:deploy
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
          DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          # Waiting for a commit means outlasting a Render build, not only a cold start.
          SMOKE_WAIT_SECONDS: ${{ inputs.expected_commit != '' && '420' || '180' }}
