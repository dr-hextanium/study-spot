name: migrate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Required reviewers and the main/v* rule are set on this environment (docs/ops.md 2.1).
    environment: production
    # DATABASE_URL is set per step, only where it is used.
    env:
      EXPECTED_DB_HOST: ${{ vars.EXPECTED_DB_HOST }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check the database host
        run: node apps/server/scripts/assert-db-host.ts --direct
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}

      - name: Migrate
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}

      - name: Deploy the API at this commit
        # The hook URL is a secret: pass it through env, never inline it in the script text.
        run: curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}" > /dev/null
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

  smoke:
    needs: migrate
    uses: ./.github/workflows/smoke-deploy.yml
    with:
      expected_commit: ${{ github.sha }}
