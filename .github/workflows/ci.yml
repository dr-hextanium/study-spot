name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Web unit tests
        run: bun run --filter '@study-spot/web' test

      - name: Web build
        run: bun run --filter '@study-spot/web' build
        env:
          VITE_API_BASE_URL: https://api.example.invalid
          VITE_DATA_BASE_URL: https://data.example.invalid

      - name: Smoke (Node)
        run: bun run smoke:node

      - name: Smoke (Bun)
        run: bun packages/db/scripts/smoke-bundle.ts

      - name: Server smoke (Node)
        run: bun run smoke:server node

      - name: Server smoke (Bun)
        run: bun run smoke:server bun

      - name: Migrations are up to date
        run: |
          bun run db:generate
          git diff --exit-code packages/db/drizzle || (echo "Schema changed without a migration. Run bun run db:generate." && exit 1)

      - name: Secret scan
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1
          -e GIT_CONFIG_KEY_0=safe.directory
          -e GIT_CONFIG_VALUE_0=/repo
          zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Playwright against the real server
        run: bun run --filter '@study-spot/web' e2e
        env:
          CI: "true"

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: perch
          POSTGRES_PASSWORD: perch
          POSTGRES_DB: perch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://perch:perch@localhost:5432/perch
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - name: Migrate
        run: bun run db:migrate

      - name: Seed
        run: bun run db:seed

      - name: Smoke (postgres.js on Node)
        run: node packages/db/scripts/smoke-postgres.ts

      - name: Bootstrap admin invite
        run: bun run admin:invite "CI Admin"
        env:
          WEB_ORIGIN: http://localhost:5173

      - name: Server smoke against Postgres (Node)
        run: bun run smoke:server node

      - name: Write and publish smoke against Postgres (Node)
        run: node apps/server/scripts/smoke-publish.ts
